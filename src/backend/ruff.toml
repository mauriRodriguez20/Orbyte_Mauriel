# Configuración de Ruff para el backend.
# Sin este archivo cada versión de Ruff mide con sus propias reglas por defecto y dos
# personas obtienen resultados distintos sobre el mismo código.
# Uso, desde src/backend: ruff check app tests

# 120 es el ancho que ya usa casi todo el código. Solo afecta a `ruff format` y al orden de
# los imports: la regla de línea larga (E501) no está activada.
line-length = 120
# La misma versión de Python que usa Render (PYTHON_VERSION en render.yaml).
target-version = "py314"

[lint]
# E4, E7, E9 y F son los errores reales de imports, sintaxis y nombres. B (bugbear) detecta
# fallos probables e I mantiene ordenados los imports.
# No se activan más familias por ahora (UP, SIM, TRY, PL, RUF y otras): son reglas de estilo
# que darían avisos sobre código que ya funciona y obligarían a tocar archivos del producto
# que nadie está cambiando. Se pueden sumar una por una, cada una en su propio PR.
select = ["E4", "E7", "E9", "F", "B", "I"]

[lint.flake8-bugbear]
# B008 prohíbe llamar funciones en los valores por defecto de los parámetros, pero así es
# como FastAPI declara sus dependencias: `usuario = Depends(require_role("fundacion"))`.
# Esas llamadas no tienen el problema que busca B008, así que se declaran como seguras.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "app.deps.require_role",
]

[lint.per-file-ignores]
# conftest.py fija las variables de entorno antes de importar la app, porque app/config.py
# las lee al importarse. Por eso sus imports no pueden ir todos al inicio del archivo (E402).
"tests/conftest.py" = ["E402"]
